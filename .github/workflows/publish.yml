name: publish

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compliance-matrix
        uses: actions/checkout@v4
        with:
          path: compliance-matrix

      - name: Checkout dev-site (for reqid resolution)
        uses: actions/checkout@v4
        with:
          repository: pryv/dev-site
          path: dev-site

      - name: Checkout open-pryv.io (for test-code resolution)
        uses: actions/checkout@v4
        with:
          repository: pryv/open-pryv.io
          path: open-pryv.io
          ref: master

      - name: Reorganize to expected layout
        run: |
          mkdir -p workspace
          mv compliance-matrix workspace/
          mv dev-site workspace/
          mv open-pryv.io workspace/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            workspace/compliance-matrix/package-lock.json
            workspace/compliance-matrix/wab/package-lock.json

      - name: Install root deps
        working-directory: workspace/compliance-matrix
        run: npm ci

      - name: Build SQLite (validate + build)
        working-directory: workspace/compliance-matrix
        run: npm run build:all

      - name: Install WAB deps
        working-directory: workspace/compliance-matrix/wab
        run: npm ci

      - name: Build WAB
        working-directory: workspace/compliance-matrix/wab
        run: npm run build

      # GitHub Pages serves this repo from the `gh-pages` branch (legacy
      # build type), so publish by pushing the built SPA to that branch —
      # the same model as wab/scripts/upload.sh, history preserved.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        working-directory: workspace/compliance-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          tmp="$(mktemp -d)"
          git clone --branch gh-pages --depth 1 "$REPO" "$tmp"
          find "$tmp" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R wab/dist/. "$tmp"/
          cd "$tmp"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m "publish: ${GITHUB_SHA}"
            git push origin gh-pages
          fi
