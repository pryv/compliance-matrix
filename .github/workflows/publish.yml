name: publish

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compliance-matrix
        uses: actions/checkout@v4
        with:
          path: compliance-matrix

      - name: Checkout dev-site (for reqid resolution)
        uses: actions/checkout@v4
        with:
          repository: pryv/dev-site
          path: dev-site

      - name: Checkout open-pryv.io (for test-code resolution)
        uses: actions/checkout@v4
        with:
          repository: pryv/open-pryv.io
          path: open-pryv.io
          ref: master

      - name: Reorganize to expected layout
        run: |
          mkdir -p workspace
          mv compliance-matrix workspace/
          mv dev-site workspace/
          mv open-pryv.io workspace/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            workspace/compliance-matrix/package-lock.json
            workspace/compliance-matrix/wab/package-lock.json

      - name: Install root deps
        working-directory: workspace/compliance-matrix
        run: npm ci

      - name: Build SQLite (validate + build)
        working-directory: workspace/compliance-matrix
        run: npm run build:all

      - name: Install WAB deps
        working-directory: workspace/compliance-matrix/wab
        run: npm ci

      - name: Build WAB
        working-directory: workspace/compliance-matrix/wab
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workspace/compliance-matrix/wab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
