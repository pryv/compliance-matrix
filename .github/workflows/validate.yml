name: validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compliance-matrix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: compliance-matrix

      - name: Checkout dev-site (for reqid resolution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pryv/dev-site
          path: dev-site

      - name: Checkout dev-site2 (for docs path resolution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pryv/dev-site2
          path: dev-site2

      - name: Checkout open-pryv.io (for test-code resolution)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pryv/open-pryv.io
          path: open-pryv.io
          ref: master

      - name: Reorganize to expected layout
        run: |
          mkdir -p workspace
          mv compliance-matrix workspace/
          mv dev-site workspace/
          mv dev-site2 workspace/
          mv open-pryv.io workspace/

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned: newer Node 24 releases abort in better-sqlite3's statement finalizer
          node-version: '24.18.1'
          cache: 'npm'
          cache-dependency-path: workspace/compliance-matrix/package-lock.json

      - name: Install deps
        working-directory: workspace/compliance-matrix
        run: npm ci

      - name: Validate
        working-directory: workspace/compliance-matrix
        run: npm run validate

      - name: Build
        working-directory: workspace/compliance-matrix
        run: npm run build

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compliance-sqlite
          path: workspace/compliance-matrix/dist/compliance.sqlite
          if-no-files-found: error
