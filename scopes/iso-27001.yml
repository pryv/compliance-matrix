  - ref: A.5.30
    title: A.5.30 ICT readiness for business continuity
    text: |
      ICT readiness shall be planned, implemented, maintained and
      tested based on business continuity objectives and ICT
      continuity requirements.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [multi-core-mTLS, backup-restore, letsEncrypt-integration]
    derives_from: [iso-27001.A.8.14, hipaa-security.164.308(a)(7)(ii)(B)]
    overview: |
      ICT-readiness Pryv
      inheritance: multi-core HA + backup-restore + cluster-replicated
      TLS certificates. The business-continuity objectives + testing
      cadence are operator policy.
