id: iso-27001
title: ISO/IEC 27001, Information Security Management Systems, Requirements
short: ISO 27001
type: standard
jurisdiction: International (ISO/IEC)
version: ISO/IEC 27001:2022
version_date: "2022-10-25"
canonical_url: https://www.iso.org/standard/27001
matrix_language: EN
curated: false

changelog:
  - date: "2026-05-19"
    change: |
      initial draft, 16 rows focused on Annex A technological controls
      where Pryv-the-software contributes directly. Clauses 4-10
      (organizational ISMS requirements) are largely QMS-side and stay
      as framing rows. Source text is paywalled, references map by
      clause + control ID only; requirement text is paraphrased.

requirements:

  # ───────────────────────────────────────────────────────────────
  # Clauses 4-10, ISMS programmatic requirements (mostly QMS-side)
  # ───────────────────────────────────────────────────────────────

  - ref: "4"
    title: Clause 4 Context of the organization
    text: |
      Organization shall determine external and internal issues relevant
      to its purpose that affect its ability to achieve the intended
      outcomes of the ISMS, and shall determine interested parties +
      requirements + scope.
    coverage: out-of-scope
    draft: true
    overview: |
      Clause 4 is the organization's strategic ISMS-scoping exercise.
      Pryv has no software role at this layer, when an organization
      adopts Pryv, the matrix supports their Clause-6 risk assessment
      by enumerating Pryv-side controls explicitly, but Clause 4 itself
      sits at the operator/implementer level.

  - ref: "6.1.2"
    title: Clause 6.1.2, Information security risk assessment
    qms_docs: [qms/pryv/02-procedures/risk-management.md]
    text: |
      Organization shall define and apply an information security risk
      assessment process that establishes and maintains criteria for
      risk acceptance, identifies risks associated with the loss of
      confidentiality, integrity and availability.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [access, permissions, audit, encryption-at-rest-secrets, multi-core-mTLS, letsEncrypt-integration, backup-restore]
    overview: |
      The risk-assessment
      methodology + the operator's specific findings are the
      operator's artefact. Pryv contributes the inventory of
      technical controls (this matrix, particularly Annex A.8 rows
      below), when the operator identifies a CIA risk, the matrix
      surfaces which Pryv primitive addresses it (or does not), so
      Annex A applicability is mechanical rather than judgemental.

  # ───────────────────────────────────────────────────────────────
  # Annex A.5 Organizational controls (selected)
  # ───────────────────────────────────────────────────────────────

  - ref: A.5.15
    title: A.5.15 Access control
    text: |
      Rules to control physical and logical access to information and
      other associated assets shall be established and implemented based
      on business and information security requirements.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [access, permissions, system-streams, delegation, CMC]
    config_keys: [cmc.memberAccess.defaultTtl, cmc.memberAccess.minTtl, cmc.memberAccess.maxTtl]
    tests: [AA01, AA02, ACCP, DCH01, DCH03, DCH12, DCH15, DCH16, DCH17, DCH18, DCH21, DCH23, OE27, CMCGA, CMCMA, GA12, GA14, GA15, GA20, GA24, MB10, CNRP1, CNRP6, CNRP7, DSC05, ASA3, ASA6, SMV1, SMV4, SMV10]
    overview: |
      Logical access control is enforced at the API surface by the
      access + permissions primitives; every read/write request is
      checked against the access's stream + level permissions. The
      operator's access-control rule definition (who gets what) is
      the policy half; technical enforcement is Pryv-side.
    detail: |
      **OAuth2 redirect + scope enforcement.** Pryv's delegated-app
      authorization path (OAuth2 authorization-code + PKCE,
      `open-pryv.io/components/oauth2/`, open-pryv.io 2.0.0-rc.8)
      enforces access rules at two points: presented redirect URIs are
      validated by exact string match (single loopback-port carve-out
      per RFC 8252 / 9700; fragment-bearing URIs rejected,
      `open-pryv.io/components/oauth2/src/clientRegistry.ts`), and the
      minted app access carries only the user's granted subset of the
      referenced consent offer's permissions. PKCE (S256) is mandatory
      for every client.

      **Delegate-account token class.** Account delegation
      (`open-pryv.io/components/delegation/`) adds an owner-equivalent
      delegate token one account holds over another. It is bound by the
      same per-stream permissions as any token; its access-control
      property is the non-forgeable, authoritative teardown, a delegate
      can never remove a delegation, and dissolving one requires a
      genuine login on the controlled account (a personal token with no
      forge-protected delegation marker). The `:_delegation:*`
      namespace is plugin-owned and guarded end to end (no user
      create/write/delete; internal subtree read-guarded and excluded
      from wildcard reads); each delegate's actions are audited on the
      controlled account. See `context/delegation-model.md`.

      **Plugin-managed and account streams, by every spelling of an id**
      (open-pryv.io 2.0.0-rc.56). The guards of the delegation
      namespace, of the plugin-managed regions of the cross-account
      (CMC) namespace (`:_cmc:`, its inbox and internal streams;
      `:_cmc:apps` stays open to apps) and of the account fields judge
      the stream an id resolves to, whatever store-prefixed spelling a
      request uses, for every token, the owner's included; they also
      refuse creating a stream under, or moving one into, a
      plugin-managed parent `[CNRP1]`, `[CNRP6]`, `[CNRP7]`, `[DSC05]`.
      On access creation and update a permission naming an account
      field through such a spelling is judged, and stored, as that
      field, so an app holding only a `*` grant on the regular streams
      cannot hand one out `[ASA3]`, `[ASA6]`. Before this release a
      store-prefixed spelling (`:local:<id>`, or the account store's
      prefix) was not recognised by these guards, so the rule above
      held only for requests using the canonical ids.

      **Moving a stream** (open-pryv.io 2.0.0-rc.56). A move (a new
      `parentId`) by an app or shared access needs manage rights on
      every stream of the moved subtree, trashed ones included, as
      deleting it does `[SMV1]`, `[SMV4]`; a parent inside the moved
      subtree is refused for every access `[SMV10]`. Before it, a child
      granted to the moving access at a lower level travelled into the
      target parent's inherited permissions.

      Apps a delegate authorizes on the controlled account get a scoped
      `app` access, never the owner-equivalent token; the server marks
      it as granted through the delegation (no client can forge the
      mark) and removes it with the delegation `[DCH01]`, `[DCH03]`,
      `[DCH12]`. In open-pryv.io 2.0.0-rc.23. Since open-pryv.io
      2.0.0-rc.30 the rule also covers cross-account (CMC) data grants:
      a delegate may accept one for the controlled account, the grant
      carries the same mark (reported by `access-info`) `[DCH15]`, the
      accept event names the approving delegate, server-stamped
      `[DCH16]`, and the detach deletes the grant and notifies the
      requester `[DCH18]`. Since open-pryv.io 2.0.0-rc.31 the account
      holder, detaching the delegate, may keep named CMC data grants
      that delegate gave (`keepAccessIds`): a kept grant loses the mark
      and becomes the holder's own `[DCH21]`, a list naming any other
      access is refused whole before any change `[DCH23]`, and every
      other access granted through the delegation is removed as before.
      Grant paths that still cannot record the
      mark (OAuth2 consent, publishing a CMC offer, widening a CMC
      grant) refuse delegation-derived tokens `[DCH17]`, `[OE27]`.

      **Member accesses of a group account** (open-pryv.io 2.0.0-rc.53,
      release commit `61fb28dd`,
      https://github.com/pryv/open-pryv.io/issues/158). For a team
      sharing one account, the rule Pryv enforces is: a member obtains
      an access on a patient account only through a membership the
      group's administrator approved, only for patient relationships
      under the member's team streams, only for named data streams
      within the patient's offer (the patient's core re-checks them
      against the grant and stamps the member on the access), and only
      for a bounded time (24 h by default, 60 s to 7 d,
      `cmc.memberAccess.*`, never beyond the membership's expiry)
      `[GA12]`, `[GA14]`, `[GA15]`, `[MB10]`, `[CMCMA]`; the access
      cannot manage accesses and is deleted when the membership ends
      `[GA20]` or the patient withdraws `[GA24]`. See
      `context/workforce-access-patterns.md`, Pattern 3.

  - ref: A.5.34
    title: A.5.34 Privacy and protection of personal information
    text: |
      Privacy and protection of personally identifiable information
      shall be identified, documented and implemented in accordance
      with applicable laws and contractual requirements.
    coverage: facilitated
    pryv_effort_saved: high
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [access, permissions, clientData, audit, system-streams]
    derives_from: [gdpr.Art.25, gdpr.Art.32]
    overview: |
      Pryv's primitive set
      carries privacy-by-design (see GDPR Art. 25) and the technical
      security controls (see GDPR Art. 32). What's on the operator's
      side: the identification of which laws apply, the documented
      privacy commitments (notice texts, consent UX), and the
      contractual side. Cross-scope link to the gdpr.* rows for the
      detailed mapping.

  # ───────────────────────────────────────────────────────────────
  # Annex A.6 People controls (selected)
  # ───────────────────────────────────────────────────────────────

  - ref: A.6.7
    title: A.6.7 Remote working
    text: |
      Security measures shall be implemented when personnel are working
      remotely to protect information accessed, processed or stored
      outside the organization's premises.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [letsEncrypt-integration, MFA, access]
    overview: |
      Pryv's API is remote-
      by-design, workforce access from off-premises traverses the
      same TLS + access-token + MFA controls as any other access.
      The operator's remote-working policy (devices, VPN, endpoint
      hardening) sits on top of this; Pryv provides the secure
      transport + auth substrate.

  # ───────────────────────────────────────────────────────────────
  # Annex A.8 Technological controls (the Pryv-contribution surface)
  # ───────────────────────────────────────────────────────────────

  - ref: A.8.2
    title: A.8.2 Privileged access rights
    text: |
      Allocation and use of privileged access rights shall be restricted
      and managed.
    coverage: configurable
    pryv_effort_saved: medium
    draft: true
    pryv_primitives: [access, system-streams]
    config_keys: [auth.adminAccessKey]
    tests: [LG20, GF33, ASA1, ASA2, ASA3, ASA6]
    overview: |
      Pryv's privileged-access surface is small and explicit: the
      operator's `auth.adminAccessKey` is the root credential; system
      streams (account, password, mfa) require an explicit grant in
      `permissions[]`. Both surfaces are auditable. The operator's
      custody process for the admin key is the policy-side control.
    detail: |
      The account-field guards (the primary email, written only through
      `account.update`; the non-editable and hidden fields; the level
      caps on account-stream permissions) judge the canonical stream id
      whatever store-prefixed spelling a request uses, on
      `events.create` / `update` / `delete` and on `accesses.create` /
      `update`, since open-pryv.io 2.0.0-rc.56 `[ASA1]`, `[ASA2]`,
      `[ASA3]`, `[ASA6]`. Before that release a store-prefixed spelling
      of an account field was not recognised by these guards: an access
      holding `contribute` on the email field could change the primary
      email (the password-reset address) through the events API, and an
      app holding only a `*` grant on the regular streams could grant
      an account field to an access it created. Upgrading is the fix;
      no setting closes it on earlier releases.

  - ref: A.8.3
    title: A.8.3 Information access restriction
    text: |
      Access to information and other associated assets shall be
      restricted in accordance with the established topic-specific
      policy on access control.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [access, permissions, stream]
    tests: [AA01, AA02, ACCP, SMV1, SMV2, SMV3, SMV4, SMV5, SMV10]
    overview: |
      Per-stream permissions are the technical access-restriction
      primitive. Stream design (which data lives where) is the
      implementer's choice; permission scoping per access is
      operationally enforced at every API call.
    detail: |
      A permission on a stream reaches its descendants, so moving a
      stream changes who reaches its subtree. Since open-pryv.io
      2.0.0-rc.56 an app or shared access may move a stream (a new
      `parentId`) only with manage rights on every stream of the moved
      subtree, trashed ones included, in addition to manage on the
      target parent; otherwise `403 forbidden` and nothing moves
      `[SMV1]` to `[SMV5]`. A parent inside the moved subtree is refused
      for every access `[SMV10]`. Before that release a child granted
      to the moving access at a lower level (`read`, `create-only`,
      `none`) moved along and took on the permissions other accesses
      held on the target parent. Renames and updates that keep the
      current `parentId` are unchanged.

  - ref: A.8.5
    title: A.8.5 Secure authentication
    text: |
      Secure authentication technologies and procedures shall be
      implemented based on information access restrictions and the
      topic-specific policy on access control.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [access, MFA, system-streams]
    config_keys: [services.mfa.mode, services.mfa.attempts.backoff, auth.passwordAttempts, auth.passwordAttempts.perIp, services.mfa.methods.sms.sendLimits, services.mfa.sessions.maxPendingPerUser]
    tests: [MFAA, MA15A, MA15C, MA3A, MA4A, MA5A, MA5B, MA6A, MA7A, MA10A, MA11A, MA12A, MBKF1, PCS1, MCHK1, CEPB1, CEPI1, CEDB1, PWSL1, MSSL1, MSSL11, MCPU1, MLSX1, MACC2]
    planned:
      - kind: enhancement
        summary: "Reference TOTP / WebAuthn plugins + AAL-tier mapping doc strengthen the A.8.5 evidence chain"
        proposal: proposals/mfa-modern-methods.md
        backlog: MFA-MODERN-METHODS
        tracking_url: https://github.com/orgs/pryv/projects/5?pane=issue&itemId=190467852&issue=pryv%7Copen-pryv.io%7C78
        impact: medium
    overview: |
      Token-based auth by default; multi-factor via `mfa.*` API methods,
      live by default since open-pryv.io 2.0.0-rc.14 (`services.mfa.active`;
      TOTP built in, SMS providers pluggable) `[MA15A]`, `[MA15C]`. The MFA
      acceptance series (`[MFAA]`) exercises activate `[MA3A]`,
      `[MA10A]`, confirm `[MA4A]`, challenge `[MA5B]`, verify `[MA5A]`,
      `[MA11A]`, deactivate `[MA6A]` and recover `[MA7A]`. Authentication strength tier is the
      operator's policy choice; technical primitives are shipped.
    detail: |
      **Failed second factors are throttled by Pryv (open-pryv.io
      2.0.0-rc.27).** A per-account backoff, never a lockout
      (open-pryv.io `6231a37c`, `aa445c43`): after
      `services.mfa.attempts.backoff.freeFailures` failures (default 3)
      within `perAccountWindowSeconds` (default 900 s), each further
      failure delays the next attempt, doubling from `baseSeconds`
      (2 s) up to `maxSeconds` (300 s); `mfa.verify` / `mfa.confirm` /
      `mfa.challenge` answer 429 `too-many-attempts` with `Retry-After`
      meanwhile, and a code sent during the delay is not checked. A
      password holder cannot lock the real user out, and a success
      clears the tally. The `attempts` block is platform-wide policy
      (same values on every core); `backoff.maxSeconds: 0` disables it.

      **Failed passwords are delayed too (open-pryv.io 2.0.0-rc.47).**
      Sign-in, `account.changePassword`, the MFA step-up by password and
      `mfa.recover` share a per-account tally
      (`auth.passwordAttempts`: after 5 failures within 900 s, delays
      from 2 s doubling up to 300 s, 429 with `Retry-After`, never a
      lockout) `[CEPB1]`, plus a budget per client address counted across
      all cores (`auth.passwordAttempts.perIp`, 30 failures per 900 s)
      `[CEPI1]`; these methods answer `400` inside a batch call or over
      socket.io `[CEDB1]`. Each password hash gets its own salt (bcrypt,
      cost 10) `[PWSL1]`. SMS second factors carry send budgets per
      session, per user, per destination across the platform and, since
      2.0.0-rc.50, per core (`services.mfa.methods.sms.sendLimits`,
      against toll fraud) `[MSSL1]`, `[MSSL11]`, and an account holds at
      most `services.mfa.sessions.maxPendingPerUser` pending MFA logins
      `[MCPU1]`; since 2.0.0-rc.51 a login refused after its MFA session
      opened ends that session, so a failed login no longer holds one of
      those places until it expires `[MLSX1]`.

      **Single-use codes and safe configuration.** A TOTP code is
      consumed with a storage compare-and-set (open-pryv.io `43293101`,
      `6231a37c`), so concurrent verifies of one code release exactly
      one token; the per-session attempt ceiling counts parallel
      attempts (`1d91696c`); and impossible `services.mfa` settings
      refuse the boot (`214b0b2b`). The private profile shows the MFA
      enrolment without its secrets and refuses writes to it
      (`25239783`, `7ce9ea6f`); recovery codes are stored hashed
      (`ef66853e`). Tests `[MA12A]`-`[MA12K]`, `[MBKF1]`-`[MBKF3]`,
      `[PCS1]`, `[MCHK1]`. Since 2.0.0-rc.51 two concurrent activations
      that both fail at the provider keep the enrolment that was pending
      before them `[MACC2]`.

  - ref: A.8.10
    title: A.8.10 Information deletion
    text: |
      Information stored in information systems, devices or in any
      other storage media shall be deleted when no longer required.
    coverage: configurable
    pryv_effort_saved: medium
    draft: true
    pryv_primitives: [event, stream, backup-restore, account-auto-deletion]
    config_keys: [storages.userAccountStorage.engine, user-account.delete, account.autoDeletion.inactivity.defaultDays]
    docs: [customer-resources/account-auto-deletion.md]
    tests: [USAD, DLN1, DLN4, DLLW1, ACXP3, ACXP8, ADSW8, ADSW19]
    overview: |
      Per-user erasure: `system.users.delete` removes the user's data
      from the live store. Engine-dependent backup behaviour (SQLite
      per-user file vs PG row deletion + backup rotation)
      determines whether erasure extends to backups, same notes as
      GDPR Art. 17 + HIPAA-Security §164.310(d) media-controls. Event-
      level and stream-level deletion live alongside for per-record
      deletion needs. Since open-pryv.io 2.0.0-rc.47 the deletion also
      erases the high-frequency series kept under the account's former
      usernames and aliases (earlier releases could leave them), and
      since 2.0.0-rc.50 points written during the deletion do not
      survive it; see GDPR Art.17 for the full list.
    detail: |
      Account auto-deletion, since open-pryv.io 2.0.0-rc.66
      (`8521c8d5`, see gdpr.Art.5 §1(e) and gdpr.Art.17). Deleting a
      whole account "when no longer required" is schedulable: by the
      account holder (a date, or a period without use) or by your
      inactivity preset, with reminder mails (`[ACXP3]`) and a minimum
      notice (`[ACXP8]`) before, through the same erasure as
      `system.users.delete`, guards included (`[ADSW8]`); an erasure
      interrupted halfway is completed at a later pass (`[ADSW19]`).

  - ref: A.8.13
    title: A.8.13 Information backup
    text: |
      Backup copies of information, software and systems shall be
      maintained and regularly tested in accordance with the agreed
      topic-specific policy on backup.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [backup-restore, backup-payload-encryption, multi-core-mTLS, external-id-index]
    tests: [BKSR, BKEV, BKVR, BKPW1, BKPF1, BKRE1, BKRE4, BKRS1, BKRS4, BKRN1, RSOW1, BKC1, BKC2, BKC3, BKC4, BKC5, BKC6, BKC7, BKCC1, BKCS1, BKCU1, BKIC1, BKIC2, BKIC4, XIDB1, XIDB2, XIDB3, XIDB4, XIDBK1, XIDBK2, BKAL1, BKAL3]
    overview: |
      `bin/backup.js`
      produces per-user backup files, the only copy of user data Pryv
      makes; a multi-core cluster replicates the platform DB only
      (rqlite Raft + mTLS), not user data, which stays on each user's
      home core. The operator's
      backup policy (cadence, retention, offsite) is layered on top.
      "Regularly tested" is the operator's drill. On the Pryv side,
      backup and restore round trips are tested: `[BKSR]` (series
      data), `[BKEV]` (events store), `[BKVR]` (manifest version), and
      `just test-backup-roundtrip` in open-pryv.io backs a seeded user
      up and restores it PostgreSQL to SQLite and back, comparing the
      bundles on counts and content (2.0.0-rc.34).

      **Take a new backup after upgrading to open-pryv.io 2.0.0-rc.34
      or later.** Earlier `bin/backup.js` backups carry no
      high-frequency series data on any series engine, with no
      warning, and series backed up from InfluxDB could not be
      restored. Since 2.0.0-rc.34 the series are exported and restored
      and move between any two series engines.

      **Check every directory that received `bin/backup.js
      --incremental` before open-pryv.io 2.0.0-rc.51.** Such a run
      overwrote the full backup it continued; the directory holds only
      the last delta and cannot be repaired. `--inspect <dir>` reports it
      `DAMAGED` and `--restore` refuses it `[BKIC2]`, `[BKC6]`: take a
      new full backup into a new directory. Since 2.0.0-rc.51 the
      incrementals form a chain next to the full backup (detail below).
    detail: |
      **Backup encryption is built in, opt-in** (open-pryv.io
      2.0.0-rc.5 onward). Without flags `bin/backup.js` writes
      plaintext (gzip-compressed) files. `--recipient-pubkey <pem>`
      (recommended: the per-backup data key is RSA-OAEP-wrapped to
      your public key, so the backup host cannot decrypt its own
      output) or `--encrypt-passphrase` / `PRYV_BACKUP_PASSPHRASE`
      (scrypt) encrypts every file with per-file authenticated
      AES-256-GCM before it reaches the destination, and the backup
      ships a standalone `decrypt-backup.mjs` plus `RESTORE-README.md`
      for recovery without Pryv. A.8.13's "protected at the same
      security level as the source data" expectation is met by
      enabling one of the two key models, or by your own layer
      (LUKS / S3 SSE-KMS / ...) on a plaintext backup; record the
      choice and the key custody (a lost key or passphrase makes the
      backup unrecoverable) in your backup-policy SOP.

      **Since open-pryv.io 2.0.0-rc.47 to 2.0.0-rc.50**: a plaintext
      backup is announced on stderr `[BKPW1]`; `--passphrase-file` keeps
      the passphrase out of the process list `[BKPF1]`; backups are
      written owner-only (`0700` / `0600`); a restore refuses an
      unexpectedly plaintext backup `[BKRE1]` (`--require-encrypted` makes
      that the rule `[BKRE4]`), unsafe names and symbolic links `[BKRS1]`,
      `[BKRS4]`, reserved names `[BKRN1]` and a username another account
      now holds `[RSOW1]`. Recipient-key encryption gives confidentiality,
      not authenticity: protect write access to the backup destination.
      See `context/operator-backup-coverage.md`.

      **Incremental chain (open-pryv.io 2.0.0-rc.51).** Each
      `--incremental` run writes its own `incrementals/<runId>/`
      directory, listed in `chain.json`, and rewrites no earlier file
      `[BKC1]`; a restore applies the full backup then each run in order,
      deletions included `[BKC2]`, `[BKIC1]`, and `--through-run <runId>`
      restores as of a given run `[BKC7]`. Runs no longer miss changes
      made while the previous run was in progress `[BKC3]` and carry the
      deletion of streams, accesses and webhooks `[BKC4]`. Each run of an
      encrypted backup has its own envelope and key under the chain's key
      model, plus its own decrypt script `[BKC5]`, `[BKCS1]`. Overlapping
      runs into one directory keep the first and set the second aside
      `[BKCC1]`. A whole-core run records the accounts it covers, so a
      restore does not re-create an account deleted between runs
      `[BKCU1]`, `[BKIC4]`. The A.8.13 "regularly tested" drill should
      include a chain restore and `--inspect` of the chain you rely on.
      The chain index and run manifests are checked for consistency, not
      signed.

      **External ids (open-pryv.io 2.0.0-rc.58).** The platform backup
      carries the external-id namespace rows with their salts; a restore
      keeps a live namespace whose salt differs and reports it `[XIDB1]`.
      The index rows are rebuilt by `bin/reconcile-user-cores.js
      --ext-ids` on each core. The accounts' own links (the core's local
      external-id table) are not in the per-user backup in 2.0.0-rc.58
      and 2.0.0-rc.59: include that table in your database-level backup
      of each core and in the restore drill. See
      `context/operator-backup-coverage.md`. From 2.0.0-rc.60 the per-user backup carries
      each account's ids (`users/<userId>/external-ids.jsonl[.gz]`:
      namespace, blinded value, claim date), also in incremental
      chains; a restore links them again after the platform rows, an
      id another account holds by then stays with it and is counted
      `lost`, an id of an unknown namespace is `skipped` `[XIDB2]`,
      `[XIDB3]`, `[XIDB4]`, `[XIDBK1]`, `[XIDBK2]`. A blinded value can
      claim its id, so a per-user backup becomes as sensitive as a
      claim credential: encrypt it (see above). An account rolled back
      by `--verify-integrity` keeps its restored ids; release them with
      the admin release if the account is to be dropped.

      **Account aliases (open-pryv.io `4547b32a`, 2.0.0-rc.66).** Earlier backups did not carry an account's aliases
      (access aliases, former usernames): after a restore its aliased
      accesses and endpoints under a former username did not route and a
      former username could be registered by someone else. From that
      release the per-user manifest lists them (`aliases`) and the restore
      reserves them again; an alias another account or core holds by then
      stays with it and is reported `[BKAL1]`. Series still held under a
      former username are exported and restored under the username
      `[BKAL3]`. Take a new backup after upgrading.

  - ref: A.8.15
    title: A.8.15 Logging
    text: |
      Logs that record activities, exceptions, faults and other
      relevant events shall be produced, stored, protected and
      analysed.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [audit, audit-event-stream, external-id-index]
    config_keys: [logs.file, logs.fileSync]
    tests: [AT01, AT02, AT03, AT51, AT52, AT53, AT61, AT65, OE07, BLGM1, BLGM2, BLGM3, BLGM4, RDL5, RDL8, RDLA, RAL1, UNXR1, PLFP1, BLFM1, XIDAR1, XIDG1]
    planned:
      - kind: feature
        summary: "Chained / signed audit log adds the software-side tamper-resistance signal A.8.15 expects"
        proposal: proposals/audit-log-chaining.md
        backlog: AUDIT-LOG-CHAINING
        tracking_url: https://github.com/orgs/pryv/projects/5?pane=issue&itemId=190467766&issue=pryv%7Copen-pryv.io%7C74
        impact: low
    overview: |
      Per-user audit log captures every API method invocation; access
      reference (accessId + accessSerial) ties each row to the
      authenticated identity. Since open-pryv.io `07b6d3b6` this
      includes the OAuth2 authorization server's own activity
      (`oauth.*` events: consent lifecycle, code exchange incl. replay
      attempts, token issued / refreshed / revoked / reuse-detected),
      authorization decisions are logged alongside the data accesses
      they enable. Audit storage uses SQLite directly to
      decouple log integrity from data-path engine issues. The
      "analysed" element (review cadence, alerting thresholds) is the
      operator's procedure.
    detail: |
      "Stored, protected" caveat, the audit log is append-only by
      convention in the write path, but there is **no software-side
      tamper-resistance signal** (no hash chain, no per-row
      signature, no operator-signed checkpoint). Protection of the
      log rests on the operator's filesystem hardening: immutable
      mounts, append-only flags (`chattr +a`), file-integrity
      monitoring (AIDE / Tripwire), out-of-band SIEM forwarding to
      a WORM store.

      Future direction: chained / signed audit log (per-row prev_hash
      + periodic operator-signed checkpoints). Tracked under internal
      backlog slug `AUDIT-LOG-CHAINING` and
      `proposals/audit-log-chaining.md`. When shipped this row's
      coverage stays Implemented but the cited primitives will
      include `audit-chain`.

      Separate audit property worth flagging to the A.8.15 auditor:
      Pryv's audit log is data-minimal by construction, it captures
      action + source + URL query + access ref + integrity hash, but
      **never the request body**. The log itself therefore qualifies
      as well-scoped under the "logs that record activities" framing
      without storing the data being acted on. Caller-supplied search
      values (`events.get` content-query conditions on the GET path)
      do appear in the recorded URL query, see
      `context/content-query-audit-semantics.md`. See
      `docs/pryv-primitives.md` audit entry for the full capture
      catalogue.

      **Server logs are protected from carrying credentials (open-pryv.io
      2.0.0-rc.43 to 2.0.0-rc.50).** The operational logs (`logs.file`,
      `logs.fileSync`, console, `DEBUG=pryv:*`) are separate from the audit
      log, and they are what a log shipper or a support engineer reads.
      Credential values are masked wherever they are logged, including
      inside a logged `Error` (message, stack, cause) and the debug output;
      the masked names cover access and refresh tokens, passphrases, the
      admin key and the platform secrets; URL user info, access-request
      keys, `readToken`, `key` / `poll` and authorization-code `code` /
      `state` values are hidden; a parameter validation error is logged
      without the rejected value; the request trace prints no Basic-auth
      user name `[BLGM1]`, `[BLGM2]`, `[BLGM3]`, `[BLGM4]`, `[RDL5]`,
      `[RDL8]`, `[RDLA]`, `[RAL1]`. A server-side fault is answered to the
      client as `Unexpected error (ref <8 hex>)`, its detail logged under
      the same reference `[UNXR1]`. The boot log identifies the admin key
      by a keyed fingerprint, not a hash a log reader could test
      candidate keys against `[PLFP1]`. Log files are created `0640`, and
      the log directories the core creates `0750` (2.0.0-rc.50; existing
      files and directories keep their modes)
      `[BLFM1]`. Check the retention of logs written by releases before
      2.0.0-rc.43, which may hold credential values; log shipping,
      retention and access to the log host stay yours.

      **External ids** (`external-id-index` primitive): an
      administrator's release of an id claimed by the wrong account
      (from 2.0.0-rc.60) is
      logged on the admin side without a user (syslog) and, when audit
      is active, in the trail of the account that held it
      (`account.externalIds.adminRelease`: namespace and reason)
      `[XIDAR1]`, so the subject's own history shows the operator's
      act. The blinded value reaches no audit row and no server log
      `[XIDG1]`. The credential-free lookup and the core-to-core holder
      answer of forced-mode sign-ins (`system.extIdHolds`, 2.0.0-rc.59)
      are not audited.

      **Long-running deployment tiering**: for the "logs … stored,
      protected, analysed" portion of A.8.15 at multi-year scales,
      the audit log is exposed via the `@pryv/datastore`
      abstraction. Operators write a custom `auditStorage` engine
      plugin to tier hot recent rows + cold archived rows (e.g.,
      S3 Object Lock, Glacier) behind the same `audit.getLogs`
      API. No Pryv-shipped pruning primitive, pressure to prune
      is operational, not regulatory (HIPAA-style retention floors
      apply; there's no max-retention rule pushing destruction).
      Full pattern at
      `context/audit-archival-via-custom-datastore.md`.

  - ref: A.8.16
    title: A.8.16 Monitoring activities
    text: |
      Networks, systems and applications shall be monitored for
      anomalous behaviour and appropriate actions taken to evaluate
      potential information security incidents.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [observability-provider, audit]
    overview: |
      The opt-in observability
      emitter (per-method metrics + error reports over OTLP) gives
      system-level monitoring; audit logs give application-level
      activity. Operator chooses backend + thresholds + escalation
      paths.
      Anomaly-detection logic on the audit stream itself is a
      potential extension.

  - ref: A.8.20
    title: A.8.20 Networks security
    text: |
      Networks and network devices shall be secured, managed and
      controlled to protect information in systems and applications.
    coverage: configurable
    pryv_effort_saved: medium
    draft: true
    pryv_primitives: [letsEncrypt-integration, multi-core-mTLS]
    config_keys: [http.ssl.keyFile, http.ssl.certFile, letsEncrypt.enabled, storages.engines.rqlite.tls, hostedSites.<name>.hsts, cmc.allowedPrivateHosts, cluster.allowInsecurePeerUrl]
    tests: [ACMEINT, ACMEORCH, CERTUTILS, FORCERENEWIPC, BUNDLEENC, HSHT, PFR1, PFR2, PFR3, PFR4, CO22]
    overview: |
      TLS in transit once configured: either the core terminates it
      (`http.ssl.*`, with the built-in ACME integration issuing,
      renewing and replicating certificates across the cluster when
      `letsEncrypt.enabled` is set) or your reverse proxy does and the
      core serves plain HTTP behind it (default `http.ip` 127.0.0.1).
      Between cores, Raft runs over mutual TLS on a private cluster CA
      once `bin/bootstrap.js` has written `storages.engines.rqlite.tls`
      (default `tls: null`, plain TCP). The core sets no TLS version of
      its own: Node.js defaults apply (TLS 1.2 floor on the Node 24 the
      image runs). Operator-side network controls (firewalls, network
      segmentation) sit on top.
    detail: |
      When a proxy in front of the core terminates TLS, set
      `hostedSites.<name>.hsts: always` on each HTTPS-only site the
      core hosts so its answers carry `Strict-Transport-Security`
      (open-pryv.io 2.0.0-rc.34). The default, `auto`, sends the header
      only when the core itself terminates TLS; `never` turns it off.
      The core does not add HSTS to API answers on a separate API
      host, so set it on your proxy there.

      Outbound side (open-pryv.io 2.0.0-rc.56): the calls Pryv makes
      to URLs a counterparty supplies (cross-account consent
      deliveries, chat, revocations, scope updates, delegation and
      OAuth revocation notices) cannot be turned toward your internal
      network. A host that is or resolves to a loopback, private,
      link-local or otherwise reserved address is refused before any
      connection, and checked again at connect time `[PFR1]`, `[PFR2]`,
      `[CO22]`; plain `http:` is refused unless
      `cluster.allowInsecurePeerUrl` (development and test clusters)
      `[PFR4]`. The platform's own host names are always allowed; list
      peers on a private network, and a private `core.url` given as an
      IP, in `cmc.allowedPrivateHosts` (host names, IPs or CIDR ranges,
      the grammar of `webhooks.allowedPrivateHosts`; checked at boot)
      `[PFR3]`. Webhook deliveries apply the same address rules. Egress
      filtering on your network stays yours.

  - ref: A.8.24
    title: A.8.24 Use of cryptography
    text: |
      Rules for the effective use of cryptography, including
      cryptographic key management, shall be defined and implemented.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [letsEncrypt-integration, encryption-at-rest-secrets, multi-core-mTLS, backup-payload-encryption]
    config_keys: [letsEncrypt.atRestKey]
    tests: [ACMEINT, ATRENC, BUNDLEENC]
    planned:
      - kind: feature
        summary: "End-to-end encryption adds a customer-key flow (CMEK / BYOK) to the cryptography catalogue"
        proposal: proposals/e2e-encryption.md
        backlog: E2E-ENCRYPTION
        tracking_url: https://github.com/orgs/pryv/projects/5?pane=issue&itemId=180707914&issue=pryv%7Copen-pryv.io%7C34
        impact: low
    overview: |
      TLS for transit (in the core when `http.ssl.*` / `letsEncrypt.*`
      is configured, otherwise in your proxy; the core sets no TLS
      version of its own, so Node.js defaults apply, a TLS 1.2 floor on
      Node 24), AES-256-GCM for at-rest operator secrets
      (HKDF-derived per-key with purpose labels), AES-256-GCM
      (scrypt-derived) for bootstrap bundle encryption, per-file
      AES-256-GCM for `bin/backup.js` output when encryption is
      requested. The operator's
      cryptography policy (key custody, rotation cadence, algorithm
      choice for engine-side at-rest encryption) is layered on top.

  - ref: A.8.25
    title: A.8.25 Secure development lifecycle
    qms_docs: [qms/pryv/01-policies/software-development-lifecycle-policy.md]
    text: |
      Rules for the secure development of software and systems shall be
      established and applied.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: awareness
    draft: true
    pryv_primitives: [audit]
    overview: |
      Pryv's own SDLC is visible
      (public commit history, tagged releases, CHANGELOG-v2 +
      CHANGELOG-v2-back, multi-engine test matrix, dependency audit).
      For the implementer, this transparency feeds supplier-
      assessment artefacts. The implementer's own SDLC for their app
      + integrations remains their ISMS artefact.

  - ref: A.8.32
    title: A.8.32 Change management
    qms_docs: [qms/pryv/02-procedures/change-control.md]
    text: |
      Changes to information processing facilities and information
      systems shall be subject to change-management procedures.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [audit]
    overview: |
      Pryv-side change-management
      evidence: tagged releases, Docker image SHA-pinning,
      CHANGELOG-v2 + CHANGELOG-v2-back per release, release-notes
      per Dokku deploy. The operator's change-management procedure
      (approvals, deployment windows, rollback plans) sits on top.
      The audit log gives the operational record of changes that
      touched data.

  - ref: A.8.34
    title: A.8.34 Protection of information systems during audit testing
    text: |
      Audit tests and other assurance activities involving assessment
      of operational systems shall be planned and agreed between the
      tester and appropriate management.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [audit]
    overview: |
      Pen-tests, vulnerability
      scans, internal audits, all may generate elevated activity on
      the system. Pryv's audit log keeps the testing activity
      attributable (any test access surfaces with its accessId +
      accessSerial in the audit rows). The plan + agreement element
      is the operator's procedure.

  # ───────────────────────────────────────────────────────────────
  # Additional A.5 organizational + A.8 technological gaps
  # ───────────────────────────────────────────────────────────────

  - ref: A.5.10
    title: A.5.10 Acceptable use of information and other associated assets
    text: |
      Rules for the acceptable use and procedures for handling
      information + associated assets shall be identified, documented
      and implemented.
    coverage: out-of-scope
    draft: true
    overview: |
      Acceptable-use policies are operator-side editorial artefacts
      (workforce code-of-conduct, asset handling rules). Pryv has no
      software role at the policy-content layer; the audit log
      supports after-the-fact enforcement evidence but doesn't
      author the rules.

  - ref: A.5.12
    title: A.5.12 Classification of information
    text: |
      Information shall be classified according to the information
      security needs of the organization based on confidentiality,
      integrity, availability + relevant interested party requirements.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: primitive
    draft: true
    pryv_primitives: [stream, system-streams, event, data-types]
    overview: |
      Pryv supports
      classification by stream layout, dedicate subtrees per
      classification tier (e.g., `confidential/`, `restricted/`,
      `public/`) and gate them with distinct permission scopes.
      System streams add a privileged-data tier independent of the
      operator's classification scheme. The operator's classification
      scheme itself (tier labels, criteria, owner) is the policy
      artefact.

  - ref: A.5.13
    title: A.5.13 Labelling of information
    text: |
      An appropriate set of procedures for information labelling shall
      be developed and implemented in accordance with the information
      classification scheme adopted by the organization.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: storage
    draft: true
    pryv_primitives: [event, clientData, stream]
    overview: |
      Labels on event-level data
      can ride on `event.clientData.classification` or on the parent
      stream's `clientData`; the canonical event-type schema
      (`data-types`) can be extended with a classification property
      when machine-readable labelling is needed downstream. Stream-
      level labels propagate to descendants by Pryv semantics.

  - ref: A.5.23
    title: A.5.23 Information security for use of cloud services
    text: |
      Processes for acquisition, use, management and exit from cloud
      services shall be established in accordance with the
      organization's information security requirements.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [data-residency, encryption-at-rest-secrets, backup-restore]
    overview: |
      When the Pryv operator
      runs on a cloud provider (rather than on-premise), the cloud-
      service security posture is the operator's contractual concern.
      Pryv-side hooks that the operator's CSP-management process
      should use: data-residency configuration locks subjects to
      chosen regions; bootstrap bundle export gives a clean cloud-
      exit path (re-issue the cluster onto new infrastructure);
      operator-side at-rest encryption isolates the cloud provider
      from plaintext. The per-release CycloneDX SBOM and
      cosign-signed image from the open-pryv.io supply-chain
      pipeline travel with the workload, so a provider exit hands
      the next environment a machine-readable composition manifest
      plus a verifiable image signature.

  - ref: A.6.3
    title: A.6.3 Information security awareness, education and training
    text: |
      Personnel and relevant interested parties shall receive
      appropriate information security awareness, education and
      training and regular updates of the organization's information
      security policy + procedures.
    coverage: out-of-scope
    draft: true
    overview: |
      Training is an organizational programme. No software role at
      the training-content / training-delivery layer; the audit log
      lets you measure whether trained workforce actually applies
      trained patterns (a defensible "training effectiveness"
      artefact for the ISMS).

  - ref: A.8.7
    title: A.8.7 Protection against malware
    text: |
      Protection against malware shall be implemented and supported by
      appropriate user awareness.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: infrastructure
    draft: true
    tests: [ACTY]
    overview: |
      Anti-malware is mostly a host / endpoint / network-layer control:
      Pryv-the-software doesn't include AV or endpoint protection, and
      your hosting environment carries that part (HDS Activity 1+2
      certified hosters typically inherit it from the CSP). Pryv does
      store and serve files your users upload, and contributes one
      narrow control there: since open-pryv.io 2.0.0-rc.34 an
      attachment whose declared type a browser executes or renders as a
      document (HTML, SVG and other XML, JavaScript) is served with
      `Content-Security-Policy: sandbox; default-src 'none'` next to
      `Content-Disposition: attachment`, so it cannot run script on the
      API origin.
    detail: |
      What stays yours: Pryv does not scan attachment content and does
      not refuse uploads by type, so a malicious PDF or executable is
      stored and served as uploaded. If your users exchange files,
      scan them (at upload in your app, or at your proxy) and cover the
      user-awareness half of the control in your ISMS. Code:
      `open-pryv.io/components/api-server/src/middleware/attachment-access.ts`.

  - ref: A.8.8
    title: A.8.8 Management of technical vulnerabilities
    text: |
      Information about technical vulnerabilities of information
      systems in use shall be obtained, the organization's exposure
      to such vulnerabilities shall be evaluated, and appropriate
      measures taken.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [observability-provider, audit]
    overview: |
      Pryv-side vulnerability
      management is upstream, public dependency-audit (npm audit
      pipeline, dependabot on open-pryv.io master), versioned
      CHANGELOG announcing relevant fixes, reproducible Docker image
      SHA. The operator's vulnerability-management cadence (when to
      upgrade, how to verify) sits on top. Observability data feeds
      incident-correlated vulnerability hunting.
    detail: |
      **Vulnerabilities found in Pryv's own code.** Beyond dependency
      advisories, the open-pryv.io maintainers ran a code-level security
      review of the source in 2026 (2026-06 to 2026-10): findings were
      confirmed by a second review, classified by severity and fixed with
      regression tests, critical and high ones first. The fixes shipped in
      open-pryv.io 2.0.0-rc.40 to 2.0.0-rc.51; most of those release notes
      open with "upgrade promptly" and name the operator steps (a
      configuration check before restarting, a one-off repair tool). The
      public report, `SECURITY-AUDIT.md`
      (https://github.com/pryv/open-pryv.io/blob/master/SECURITY-AUDIT.md,
      published 2026-10-14), lists each finding with its severity, the
      release that fixed it and the operator action, plus the known
      residual risks; it is revised with every release that carries a
      security fix. See `context/code-security-review-2026.md`.

      Your part of A.8.8: watch the release notes and `SECURITY.md`
      advisories, assess your exposure (which release you run, which
      features you enabled), and upgrade on your own schedule, running each
      release's operator steps. Image hygiene moved in the same releases:
      the image installs the Debian security updates available at build
      time and no longer ships `curl` (2.0.0-rc.42) nor `npm` / `npx`
      (2.0.0-rc.50), which removes the scan findings those tools carried;
      OS-level findings of the pinned base image remain visible to the
      scanners.

  - ref: A.8.9
    title: A.8.9 Configuration management
    text: |
      Configurations, including security configurations, of hardware,
      software, services and networks shall be established, documented,
      implemented, monitored and reviewed.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [audit]
    planned:
      - kind: feature
        summary: "Read-only effective-configuration endpoint supplies per-core configuration-management evidence without host access"
        proposal: proposals/config-effective-exposure.md
        tracking_url: https://github.com/orgs/pryv/projects/5?pane=issue&itemId=219705795&issue=pryv%7Copen-pryv.io%7C118
        impact: medium
    overview: |
      Pryv configuration lives in
      `default-config.yml` + `override-config.yml` + `host-config.yml`
      (operator-side); a `config-validation` step on master start
      fails fast on unresolved variables or missing required service
      fields, giving a baseline "configuration is well-formed" check.
      The operator's config-change procedure (versioning, approval,
      deployment) sits on top. Audit log shows when config-driven
      behaviour changed observably.

  - ref: A.8.11
    title: A.8.11 Data masking
    text: |
      Data masking shall be used in accordance with the organization's
      topic-specific policy on access control + other related topic-
      specific policies, and business requirements, taking applicable
      legislation into consideration.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: primitive
    draft: true
    pryv_primitives: [randomAlias, stream, system-streams, event, external-id-index]
    tests: [XIDC1, XIDC7, XIDG1, XIDN4]
    overview: |
      Pryv enforces masking by **projection**, not transformation:
      stream-level isolation + permission-scoped access tokens hide
      whole sub-trees from a given role. The "rewrite a value before
      display" flavour of masking (e.g., `j***@example.com`) lives in
      the calling application, by design.
    detail: |
      The boundary is recorded in
      `context/data-masking-projection-vs-transformation.md`:
        - Stream-tree split + narrow access tokens = Pryv's
          projection-side contribution. Auditor-visible via the
          access permissions matrix.
        - Field-substring rewrites, hash-on-read, faker substitution,
          per-role redaction = application layer. Not Pryv's job by
          design (storage layer stays deterministic; "partially
          redacted" is not an API response).
        - Username-side pseudonymisation is the one transformation
          Pryv does natively: `accesses.create {randomAlias:true}` mints
          a routable `r-XXXXXXXX` alias that hides the username per access
          (`proposals/aliases-as-pseudonymization-primitive.md`); it
          survives a backup and restore and routes on every topology
          since open-pryv.io `4547b32a`. It masks the username from the
          holder, it does not stop a holder who guesses the username
          from confirming it.
        - Third-party record ids are masked before they reach Pryv
          (open-pryv.io 2.0.0-rc.58, `external-id-index` primitive): your
          service sends `HMAC(K_namespace, recordId)` with a key it keeps,
          the platform index stores a token of it mapped to a core, and
          no listing, error, log line or audit record returns the value
          `[XIDC1]`, `[XIDC7]`, `[XIDG1]`, `[XIDN4]`. Key custody is
          yours: every holder of `K_namespace` can look up and claim ids
          of that namespace.
        - Static masking for non-prod environments + field-level
          encryption at the schema layer are both implementer
          concerns today; end-to-end encryption
          (`proposals/e2e-encryption.md`) is the natural future
          primitive for both.
        - The audit log itself is data-minimal by construction,
          captures action + access + integrity hash, never the
          request body (see `docs/pryv-primitives.md` audit entry).

  - ref: A.8.12
    title: A.8.12 Data leakage prevention
    text: |
      Data leakage prevention measures shall be applied to systems,
      networks and any other devices that process, store or transmit
      sensitive information.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: primitive
    draft: true
    pryv_primitives: [access, permissions, audit, observability-provider, shared-secrets]
    overview: |
      Pryv's primary leakage-
      prevention surface is the permission model, an access only
      reads / writes the streams its scope permits, so a misconfigured
      app can't accidentally exfiltrate out-of-scope data. The audit
      log surfaces anomalous access patterns post-facto. The
      shared-secrets primitive closes a classic leakage channel:
      credentials handed to third parties travel as a one-time random
      key instead of a URL-embedded token, so browser history, referrer
      headers, and server access logs stop accumulating live
      credentials. Network / endpoint DLP (browser-side copy-paste
      protection, USB blocking, etc.) is the operator's
      endpoint-management scope.

  - ref: A.8.22
    title: A.8.22 Segregation of networks
    text: |
