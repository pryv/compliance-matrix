  - ref: A.8.19
    title: A.8.19 Installation of software on operational systems
    text: |
      Procedures and measures shall be implemented to securely manage
      software installation on operational systems.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [audit]
    overview: |
      Pryv ships as a single
      Docker image with SHA-pinned tag; the installation channel is
      reproducible. Operator's installation procedure (build
      verification, signature checking, change-approval gate) sits
      on top.

  - ref: A.8.21
    title: A.8.21 Security of network services
    text: |
      Security mechanisms, service levels and service requirements of
      network services shall be identified, implemented and monitored.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [letsEncrypt-integration, multi-core-mTLS, observability-provider]
    derives_from: [iso-27001.A.8.20]
    docs: [customer-resources/rate-limiting.md]
    config_keys: [auth.passwordAttempts, http.trustedProxies, access.maxLiveRequestsPerIp, socketIO.maxMessageBytes, limits.batch.maxTotalItems, uploads.maxFiles, dns.tcpMaxConnections]
    tests: [CEPB1, CEPI1, CEPI2, CEDB1, CEDB5, RAI1, EGLV1, MPLM3, SION4, IVCK1, WHTT1, PVPX1, DNR01]
    overview: |
      Pryv's external
      network surface is the TLS-terminating HTTPS API + the embedded
      DNS server (when multi-core enabled); both are monitored via
      observability. Inter-core mTLS is the internal surface. The
      operator's broader network-service portfolio (LB, WAF, VPN)
      sits outside Pryv.
    detail: |
      **General rate limiting / DoS protection stays operator-side**
      (reverse proxy / WAF / API gateway): general in-process
      throttling was rejected because (1) multi-core load distribution
      makes per-core counters mis-fire and (2) abuse signatures are
      operator-specific. Pryv contributes the **detection layer**
      (audit log + observability metrics + `accesses.delete`
      revocation) and, since open-pryv.io 2.0.0-rc.47, **targeted
      in-code budgets** on the paths it can count correctly: failed
      passwords per account and per client address across all cores
      (`auth.passwordAttempts`) `[CEPB1]`, `[CEPI1]`; credential
      methods refused inside batches and over socket.io `[CEDB1]`;
      live `/reg/access` requests per address
      (`access.maxLiveRequestsPerIp`) `[RAI1]`; batch, paging, upload
      and socket.io message bounds `[CEDB5]`, `[EGLV1]`, `[MPLM3]`,
      `[SION4]`; and in 2.0.0-rc.50 an invitation-check budget
      `[IVCK1]`, a `webhooks.test` interval `[WHTT1]` and preview
      limits `[PVPX1]`. Failed MFA second factors have had a
      per-account backoff since 2.0.0-rc.27
      (`services.mfa.attempts.backoff`), see A.8.5. The per-address
      budgets read the client address through `http.trustedProxies`
      only: behind your reverse proxy, list it there `[CEPI2]`. The
      embedded DNS server validates requests and bounds its TCP
      connections (`dns.tcpMaxConnections`, 2.0.0-rc.46) `[DNR01]`.
      These budgets do not replace an edge layer for volumetric
      traffic, per-token request rates and WAF rules. Full rationale +
      operator mitigation patterns:
      `context/rate-limiting-and-dos-protection.md`. Reference nginx +
      fail2ban configuration, verified against a running core (per-IP
      and per-token limits on the routes that matter, ban jails, limits
      per workload profile, a load test proving the limits fire):
      `customer-resources/rate-limiting.md` on the developer site.

  - ref: A.8.26
    title: A.8.26 Application security requirements
    text: |
      Information security requirements shall be identified, specified
      and approved when developing or acquiring applications.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: awareness
    draft: true
    pryv_primitives: [audit]
    derives_from: [iso-27001.A.8.25]
    config_keys: [cmc.allowedPrivateHosts]
    tests: [ACTY, MC04D, HTC1, HSPE1, QPR2, PFR1, PFR2, PFR4, PFR5, PFR6, PFR10, CO21, CO22, RQ33]
    overview: |
      For the operator running
      Pryv as one of its applications, this compliance matrix IS the
      catalogue of identified + specified + approved security
      requirements Pryv satisfies. For the operator's own applications
      built on Pryv, the requirements are their editorial work.
    detail: |
      Example of a requirement Pryv implements for you: content a user
      uploads cannot attack other users through the API origin. Since
      open-pryv.io 2.0.0-rc.34 an attachment whose declared type a
      browser executes or renders as a document (HTML, SVG and other
      XML, JavaScript) is served with `Content-Security-Policy:
      sandbox; default-src 'none'` next to `Content-Disposition:
      attachment`, on the token and the `readToken` paths alike
      (`open-pryv.io/components/api-server/src/middleware/attachment-access.ts`).
      Uploads are not refused for their type. If your app displays HTML
      or SVG attachments, fetch the content and render it in your app's
      own sandbox: that part of the requirement is yours.

      A second example, in the sign-in flow: an authorisation request
      (`POST /reg/access`) no longer has a `REDIRECTED` outcome
      (open-pryv.io 2.0.0-rc.36, `62ab4f7e`, merged in
      `1aa22e1a`). That status let anyone holding a request key store an
      unvalidated URL that was then served to the authentication page
      under a field such pages follow. It is now refused (`400
      invalid-parameters`), no outcome post stores a `redirectUrl`, and
      the poll never answers `REDIRECTED` `[MC04D]`. No shipped
      authentication page sent it; if your own page did, it must stop
      (a request stays on the core that created it, and an account on
      another core is served through the shared-secret hand-off
      between cores).

      Further examples from the 2026 security review (open-pryv.io
      2.0.0-rc.49 and 2.0.0-rc.50; `context/code-security-review-2026.md`):
      every JSON answer of the API carries `Cache-Control: no-store` and
      `Vary: Origin`, so neither a browser nor a shared cache keeps API
      answers `[HTC1]`; a hosted proxy site refuses a path holding an
      encoded separator or a dot segment before it reaches the upstream
      `[HSPE1]`; query strings are parsed without letting a key shadow a
      built-in object property `[QPR2]`. If you put a cache or CDN in front
      of the API, keep it honouring these directives.

      Another, for outbound calls (open-pryv.io 2.0.0-rc.56): a URL a
      counterparty supplies cannot make the server call an address it
      should not reach. The cross-account, delegation and OAuth
      revocation calls refuse, before any connection, a host that is or
      resolves to a loopback, private, link-local or otherwise reserved
      address (unless listed in `cmc.allowedPrivateHosts`), plain
      `http:` and URLs carrying credentials, do not follow redirects and
      stop reading an answer past 1 MiB `[PFR1]`, `[PFR2]`, `[PFR4]`,
      `[PFR5]`, `[PFR6]`, `[CO22]`; a refusal names the host, never the
      path or a token `[PFR10]`, and a refused delivery is not retried
      `[CO21]`, `[RQ33]`.

  - ref: A.8.27
    title: A.8.27 Secure system architecture and engineering principles
    text: |
      Principles for engineering secure systems shall be established,
      documented, maintained and applied to any information systems
      development activities.
    coverage: facilitated
    pryv_effort_saved: high
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [access, permissions, system-streams, encryption-at-rest-secrets]
    derives_from: [iso-27001.A.8.25, iso-27001.A.8.28]
    overview: |
      Pryv's architecture is
      informed by secure-by-design principles (per-user isolation,
      least-privilege permissions, TLS in the core or at the proxy,
      system-stream privilege separation). The operator's own
      engineering team applies the same principles to app-layer code.
      Pryv-side architecture documentation lives in public
      open-pryv.io README + this matrix.

  - ref: A.8.29
    title: A.8.29 Security testing in development and acceptance
    text: |
      Security testing processes shall be defined and implemented in
      the development life cycle.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: evidence
    draft: true
    pryv_primitives: [audit]
    overview: |
      Pryv's CI runs the public
      test matrix per commit (PG + SQLite modes; component-level +
      integration tests).
      Operator's own application-layer security testing (SAST, DAST,
      pen-test before release) is layered on top.
    detail: |
      **Security review of the platform code.** In 2026 (2026-06 to
      2026-10) the open-pryv.io maintainers reviewed the source surface by
      surface for security defects; each finding was confirmed by a second
      review, fixed with a regression test that now runs in the CI matrix,
      and each fix release was reviewed before merge. The fixes shipped in
      open-pryv.io 2.0.0-rc.40 to 2.0.0-rc.51. The public report,
      `SECURITY-AUDIT.md`
      (https://github.com/pryv/open-pryv.io/blob/master/SECURITY-AUDIT.md,
      published 2026-10-14), describes the method, the surface inventory,
      the areas reviewed without a finding, and each finding with its fix.
      Methodology and the fix areas: `context/code-security-review-2026.md`.
      This is security testing of Pryv's code, done by its maintainers; the
      testing of your own applications, integrations and deployment (and any
      independent penetration test your programme requires) remains yours.

  - ref: A.8.33
    title: A.8.33 Test information
    text: |
      Test information shall be appropriately selected, protected and
      managed.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [data-residency, multi-core-mTLS]
    derives_from: [iso-27001.A.8.31]
    overview: |
      When test environments
      use real-or-derived PII, the same protections as production
      apply. Pryv pattern: run test environments as separate Pryv
      clusters (independent bootstrap bundles + cluster CAs); the
      data-residency primitive prevents accidental cross-environment
      data flow at the user-binding layer.

  # ─── Annex A.7 physical (Pryv-software has limited footprint here) ───

  - ref: A.7.1
