  - ref: A.5.16
    title: A.5.16 Identity management
    text: |
      The full life cycle of identities shall be managed.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [access, system-streams, audit, delegation, CMC]
    derives_from: [iso-27001.A.5.15, hipaa-security.164.308(a)(4)(ii)(C)]
    tests: [AA01, AA02, ACCP, UZEV, DCH02, DCH12, CMCGA, GA01, GA10, GA20, GA21, GA23]
    overview: |
      Pryv's account + access primitives implement the full identity
      lifecycle: create (registration), enable (login + access mint),
      modify (accesses.update, account.update), suspend (access
      narrowing), terminate (accesses.delete + system.users.delete).
      Audit log gives the per-stage evidence. The naming + assignment
      policy is the operator's.
    detail: |
      For workforce / role-scale deployments, Pryv composes with an
      external IdP / IGA system via two patterns documented in
      `context/workforce-access-patterns.md`: (1) group access +
      `callerId` audit suffix, (2) seed access + sub-access
      derivation. **Roles + groups themselves are deliberately
      outside Pryv;** the IdP is the source of truth for identity
      lifecycle, and Pryv records the resulting access state +
      per-individual audit trail. A third pattern ships in
      open-pryv.io 2.0.0-rc.53 (release commit `61fb28dd`,
      https://github.com/pryv/open-pryv.io/issues/158): for a team
      sharing one account that reaches patient data through
      cross-account consent, each member is their own Pryv account,
      joins through a membership request an administrator of the group
      approves `[GA01]`, acts on patient accounts under accesses the
      group's core issues and the patient's core stamps with their
      identity `[GA10]`, and leaves (or is removed, including when the
      delegate who approved them is detached) with those accesses
      swept by the platform `[GA20]`, `[GA21]`, `[GA23]`. Roles stay
      outside Pryv in that pattern too: a team is a stream, a
      membership is a consent relationship. See
      `context/workforce-access-patterns.md`, Pattern 3.

      **Delegated-app identity via OAuth2.** For app identities, Pryv
      ships an OAuth2 authorization-code + PKCE flow
      (`open-pryv.io/components/oauth2/`, open-pryv.io 2.0.0-rc.8): each
      client is a curated identity the operator registers through
      `bin/oauth-client.js` (create / rotate-secret / list, the full
      credential lifecycle), authenticating with mandatory PKCE (S256
      only) against an exact-match registered redirect-URI set. Open
      self-registration is disabled, so every client identity is
      operator-authorised before it exists.

      **Delegate-account identity lifecycle.** Account delegation
      (`open-pryv.io/components/delegation/`) manages the lifecycle of a
      delegate relationship between two accounts: a controlled-account-
      initiated invite / accept handshake creates it (create-from-
      delegate can provision the controlled account itself, optional
      email/password seed), an owner-equivalent delegate token enables
      it, and an authoritative detach terminates it, reserved to a
      genuine login on the controlled account (a delegate can never
      remove a delegation). Each delegate acts under its own
      attributable token, audited on the controlled account (same-core
      + cross-core), and `accessInfo` names the acting delegate. See
      `context/delegation-model.md`.

      App identities a delegate authorizes for the controlled account
      carry that lineage for their whole life: `accessInfo` reports
      them as granted through the delegation (`grantedVia: 'app'`,
      naming the delegate) `[DCH02]`, and they end with the delegation
      `[DCH12]`. In open-pryv.io 2.0.0-rc.23.

  - ref: A.5.17
    title: A.5.17 Authentication information
    text: |
      Allocation and management of authentication information shall be
      controlled by a management process, including advising personnel
      on appropriate handling.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [system-streams, MFA, encryption-at-rest-secrets, shared-secrets]
    planned:
      - kind: enhancement
        summary: "Reference MFA plugins broaden the authentication-information catalogue"
        proposal: proposals/mfa-modern-methods.md
        backlog: MFA-MODERN-METHODS
        tracking_url: https://github.com/orgs/pryv/projects/5?pane=issue&itemId=190467852&issue=pryv%7Copen-pryv.io%7C78
        impact: low
    overview: |
      Pryv stores
      credentials on a privileged system-stream (`:_system:password`
      etc.). MFA secrets stay server-side: the TOTP secret encrypted at
      rest in the private profile, recovery codes stored hashed, and
      neither is returned by the profile methods (open-pryv.io
      `7ce9ea6f`). Operator's
      secret-distribution + secret-rotation policy is the
      organizational programme; Pryv provides the secure storage tier.
    detail: |
      **OAuth2 token + secret handling.** Where you delegate access to
      apps, Pryv's OAuth2 flow (`open-pryv.io/components/oauth2/`,
      open-pryv.io 2.0.0-rc.8) manages the authentication material for
      you: access tokens are short-lived (`oauth.accessTokenTTL`,
      default 1 h), refresh tokens are single-use and rotate on every
      exchange with a sliding TTL bounded by an absolute cap
      (`oauth.refreshTokenTTL` / `oauth.refreshTokenAbsoluteTTL`), and a
      replayed (already-rotated) refresh token fails the exchange
      (`open-pryv.io/components/oauth2/src/grants/refresh_token.ts`).
      Confidential clients hold a rotatable `client_secret`
      (`bin/oauth-client.js rotate-secret`). The operator's broader
      secret-distribution + rotation programme stays the organizational
      half; Pryv supplies the short-TTL + rotation mechanics.

      **Transmitting authentication information to a third party.**
      "Appropriate handling" includes how a credential travels when you
      hand it to someone else. Pryv's shared-secrets endpoints
      (`open-pryv.io/components/shared-secrets/`) replace the
      URL-embedded-token pattern with a one-time random key: redeemable
      exactly once, mandatory TTL, only the SHA-256 of the key's random
      half stored server-side, payload scrubbed when the item leaves
      the pending state (on redemption, on a signature mismatch, and on
      the first retrieval attempt after the TTL; expiry is enforced on
      access, not by a background sweeper, so an untouched expired
      secret keeps its payload until something reaches it or you delete
      it), optional passphrase / HMAC signature on redemption. Your handling policy
      ("never send credentials in links or logs") gains a shipped
      mechanism to point at instead of a prohibition alone. A
      `secretSharing: forbidden` feature permission, inherited by
      child accesses, lets you exclude publicly-exposed tokens from
      the mechanism entirely. The same one-time-key mechanism carries the
      session token when an account holder signs in through an external
      OpenID Connect provider (`sso.*`, beta, off by default): the token
      is never placed in the redirect URL, and the federated login is
      gated so an external identity cannot claim an account whose email
      was never inbox-proved.

  - ref: A.5.18
    title: A.5.18 Access rights
    text: |
      Access rights to information and other associated assets shall be
      provisioned, reviewed, modified and removed in accordance with
      the organization's topic-specific policy on, and rules for,
      access control.
    coverage: implemented
    pryv_effort_saved: high
    draft: true
    pryv_primitives: [access, permissions, audit, CMC]
    derives_from: [iso-27001.A.5.15, iso-27001.A.5.16, hipaa-security.164.308(a)(3)(ii)(C)]
    tests: [AA01, AA02, ACCP, CMCMR, GA01, GA10, GA20, GA22, GA41, MR25]
    overview: |
      Same primitive surface as A.5.15 + A.5.16, accesses.create /
      .update / .delete cover the lifecycle stages; access version
      history provides the review-evidence layer.

      When an access expires, what hangs off it ends too: a `shared`
      access managed by an app access can no longer outlive it (it
      inherits the app access's expiry at creation, clearing that expiry
      is refused, and authentication refuses a never-expiring shared
      access once its app access has expired, `5d609bfa`), and a webhook
      stops firing and becomes `inactive` once its access has expired
      (`3394b95f`), both in open-pryv.io 2.0.0-rc.23.
    detail: |
      **Group accounts over CMC** (open-pryv.io 2.0.0-rc.53, release
      commit `61fb28dd`, https://github.com/pryv/open-pryv.io/issues/158).
      For a team sharing one account, a member's rights on patient
      accounts follow their membership: provisioned only under an
      approved membership `[GA01]`, `[GA10]`, reviewable from the group
      account (each access asked for and each removal is an event
      naming the member; a revoked membership stays readable as a
      deletion record) `[GA22]`, narrowed with it `[GA41]`, and removed
      on every patient account when it ends `[GA20]`, with residuals
      recorded, retried by the retry loop and the periodic pass
      `[MR25]`, and bounded by the access's own expiry. See
      `context/workforce-access-patterns.md`, Pattern 3.

