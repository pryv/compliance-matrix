  - ref: A.8.6
    title: A.8.6 Capacity management
    text: |
      The use of resources shall be monitored + adjusted in line with
      current + expected capacity requirements.
    coverage: facilitated
    pryv_effort_saved: medium
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [observability-provider, multi-core-mTLS]
    docs: [customer-resources/rate-limiting.md]
    config_keys: [limits.batch.maxTotalItems, uploads.maxFiles, socketIO.maxMessageBytes, eventFiles.previewsMaxInputPixels, eventFiles.previewsRenderConcurrency]
    tests: [CEDB5, CEDB6, EGLV1, EGLC1, MPLM3, MPLD1, SION1, SION4, PVPX1, PVRQ1, WRBO1]
    overview: |
      Pryv-side capacity
      surfaces: per-core observability metrics (memory, CPU, latency,
      request volume); horizontal scaling via adding cores to the
      cluster (each handles its bound users + shared rqlite control
      plane). Operator's capacity-planning cadence + provisioning
      automation sit on top.
    detail: |
      **Resource bounds inside the core (open-pryv.io 2.0.0-rc.47 and
      2.0.0-rc.50).** One client can no longer exhaust a core's capacity
      through a single call shape: a batch holds at most 1000 calls with
      its results bounded together (`limits.batch.maxTotalItems`)
      `[CEDB5]`, `[CEDB6]`; `events.get` paging is bounded and PostgreSQL
      results are streamed through a cursor instead of loaded whole
      `[EGLV1]`, `[EGLC1]`; uploads are limited in parts, files
      (`uploads.maxFiles`) and size by default `[MPLM3]`, `[MPLD1]`;
      socket.io namespaces exist only for user names and messages are
      bounded (`socketIO.maxMessageBytes`) `[SION1]`, `[SION4]`;
      previews refuse images declaring more than
      `eventFiles.previewsMaxInputPixels` and render at most
      `eventFiles.previewsRenderConcurrency` at once `[PVPX1]`,
      `[PVRQ1]`; a crashing worker is replaced after a growing delay
      `[WRBO1]`. These protect capacity; sizing the cores, watching the
      metrics and scaling stay yours. See
      `context/rate-limiting-and-dos-protection.md`.

  - ref: A.8.14
    title: A.8.14 Redundancy of information processing facilities
    text: |
      Information processing facilities shall be implemented with
      redundancy sufficient to meet availability requirements.
    coverage: facilitated
    pryv_effort_saved: high
    facilitation_mode: infrastructure
    draft: true
    pryv_primitives: [multi-core-mTLS, backup-restore, letsEncrypt-integration]
    derives_from: [iso-27001.A.5.23, hipaa-security.164.308(a)(7)(ii)(B)]
    overview: |
      Multi-core Raft replication
      makes the platform DB (user-to-core index, shared settings,
      certificates) redundant, so the cluster keeps routing and serving
      TLS when a peer fails. User data is not replicated between
      cores: the users homed on a failed core are unavailable until
      that core, or its restore from backup, is back. Redundancy of
      user data is yours to add under the storage engine (e.g.
      PostgreSQL streaming replication, replicated volumes). The
      availability target + redundancy depth is operator policy.
    detail: |
      Since open-pryv.io 2.0.0-rc.34 the replicated platform DB runs on
      rqlite 10.5.1: a node killed while taking a snapshot no longer
      risks restoring stale pages into its copy (as under 9.x),
      snapshot files are checksummed, a node stops on a node-local
      SQLite error instead of diverging, and the first write a follower
      forwards to a restarted leader no longer fails once. Upgrading a
      cluster is one-way for each node's data directory and needs the
      nodes upgraded back to back (followers first, never adding a node
      while versions are mixed): `open-pryv.io/INSTALL.md`, "Upgrading
      the bundled rqlite (9.x to 10.x)".

  - ref: A.8.17
    title: A.8.17 Clock synchronization
    text: |
      Clocks of information processing systems used by the organization
      shall be synchronized to approved time sources.
    coverage: facilitated
    pryv_effort_saved: low
    facilitation_mode: awareness
    draft: true
    pryv_primitives: [multi-core-mTLS, letsEncrypt-integration]
    overview: |
      Clock sync stays your host's job (chronyd / ntpd): Pryv stores
      whatever timestamp the host produces. Pryv makes a badly skewed
      clock visible at the two points where it breaks a core: a new
      core whose clock differs from the cluster's is refused at join,
      and a TLS certificate outside the local clock's validity window
      is neither installed nor hot-swapped.
    detail: |
      Pryv's architecture is **core-affine**, every user's data
      operations resolve to one core (see
      `context/core-affinity-architecture.md`). Cores never need to
      agree on clock value or on cert validity with each other; the
      dangerous failure modes are all intra-core (one core's own
      clock vs its own loaded cert / its own audit-row timestamps).

      **Pryv's existing contribution to skew detection**: every API
      response carries `meta.serverTime` (Unix timestamp seconds;
      `components/api-server/src/methods/helpers/setCommonMeta.ts`).
      Webhook payloads include the same. Clients use this to detect
      their own clock skew vs the server.

      **Shipped** (open-pryv.io `5266b697`, released after
      2.0.0-rc.34; see
      `proposals/clock-skew-cluster-checks.md`): two intra-core
      checkpoints. (1) Bootstrap join: before acking, a new core
      compares its clock with the issuing core's (`meta.serverTime`
      of its API root, else the HTTP `Date` header) and refuses the
      join beyond `--bootstrap-clock-skew-seconds` (default 30 s, `0`
      disables); the join token is not used, so fixing the clock and
      re-running succeeds. (2) Certificate load: a certificate whose
      `notBefore..notAfter` window does not contain the local clock
      (tolerance `cluster.clockSkewSeconds`, default 30 s) is not
      materialized from PlatformDB nor hot-swapped into the workers,
      and a custom certificate outside its window is reported at boot.
      What stays yours: run a clock service on every host. Pryv does
      no periodic clock polling.

  - ref: A.8.18
    title: A.8.18 Use of privileged utility programs
    text: |
      The use of utility programs that can be capable of overriding
